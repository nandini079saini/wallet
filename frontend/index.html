<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wallet App - Login / Signup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Wallet App</h1>

    <div class="card">
      <h2>Sign Up</h2>
      <form id="signup-form">
        <label>
          Name
          <input type="text" id="signup-name" required>
        </label>
        <label>
          Email
          <input type="email" id="signup-email" required>
        </label>
        <label>
          Password
          <input type="password" id="signup-password" required>
        </label>
        <button type="submit">Create account</button>
      </form>
      <p id="signup-message" class="message"></p>
    </div>

    <div class="card">
      <h2>Login</h2>
      <form id="login-form">
        <label>
          Email
          <input type="email" id="login-email" required>
        </label>
        <label>
          Password
          <input type="password" id="login-password" required>
        </label>
        <button type="submit">Login</button>
      </form>
      <p id="login-message" class="message"></p>
    </div>
  </div>

  <script>
    const API_BASE = "https://wallet-backend-op4d.onrender.com";

    // --- SIGNUP ---
    const signupForm = document.getElementById("signup-form");
    const signupMsg = document.getElementById("signup-message");

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      signupMsg.textContent = "";

      const body = {
        name: document.getElementById("signup-name").value.trim(),
        email: document.getElementById("signup-email").value.trim(),
        password: document.getElementById("signup-password").value,
      };

      try {
        const res = await fetch(`${API_BASE}/auth/signup`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });

        const data = await res.json();

        if (res.ok) {
          signupMsg.textContent = "Signup successful! You can log in now.";
          signupMsg.classList.remove("error");
          signupMsg.classList.add("success");
          signupForm.reset();
        } else {
          signupMsg.textContent = data.detail || "Signup failed";
          signupMsg.classList.remove("success");
          signupMsg.classList.add("error");
        }
      } catch (err) {
        signupMsg.textContent = "Network error. Is backend running?";
        signupMsg.classList.remove("success");
        signupMsg.classList.add("error");
      }
    });

    // --- LOGIN ---
    const loginForm = document.getElementById("login-form");
    const loginMsg = document.getElementById("login-message");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginMsg.textContent = "";

      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      // OAuth2PasswordRequestForm expects form-data:
      // username = email, password = password
      const formData = new URLSearchParams();
      formData.append("username", email);   // <-- email goes here
      formData.append("password", password);

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData.toString(),
        });

        const data = await res.json();

        if (res.ok) {
          // Save token and go to dashboard
          localStorage.setItem("access_token", data.access_token);
          window.location.href = "dashboard.html";
        } else {
          loginMsg.textContent = data.detail || "Login failed";
          loginMsg.classList.remove("success");
          loginMsg.classList.add("error");
        }
      } catch (err) {
        loginMsg.textContent = "Network error. Is backend running?";
        loginMsg.classList.remove("success");
        loginMsg.classList.add("error");
      }
    });
  </script>
</body>
</html>
